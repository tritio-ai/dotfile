# Enable mouse support, including wheel scrolling through pane history.
set -g mouse on

# Keep enough scrollback for normal development sessions.
set -g history-limit 100000

# Use Emacs-style keys in copy mode.
setw -g mode-keys emacs

# Prefix h enters copy mode for scrolling, searching, and copying history.
bind-key h copy-mode

# Prefix C-y pastes the latest tmux buffer without stealing shell C-y.
bind-key C-y paste-buffer

# Emacs-like range selection in copy mode: C-Space or C-x Space marks, M-w copies, C-g cancels.
bind-key -T copy-mode C-Space send-keys -X begin-selection
bind-key -T copy-mode C-x switch-client -T copy-mode-ctrl-x
bind-key -T copy-mode-ctrl-x Space send-keys -X begin-selection
bind-key -T copy-mode M-w send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-w send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-g send-keys -X cancel

# Start windows and panes at 1 for easier keyboard selection.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Make tmux use a modern terminal feature set when available.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
